# Skill 許願池 —— 反向代理設定
#
# 放法:存成一個**新的**設定檔(例如 /etc/nginx/conf.d/skill-wishpool.conf 或
# aaPanel/寶塔的 vhost 目錄),不要去改任何現有站台的檔案。
# 詳細步驟與檢查順序見 deploy/README.md。

# 選用:在代理層加一層速率限制。伺服器自己也有(每來源每小時 5 願望 / 60 附議),
# 這一層是多的保險,擋的是還沒進到 Python 就該被丟掉的量。
limit_req_zone $binary_remote_addr zone=wishpool_write:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wish.example.com;          # ← 改成你的網域
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wish.example.com;          # ← 改成你的網域

    ssl_certificate     /etc/letsencrypt/live/wish.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wish.example.com/privkey.pem;

    # 許願的內容上限是 64KB,不需要更大。
    client_max_body_size 128k;

    access_log /var/log/nginx/skill-wishpool.access.log;
    error_log  /var/log/nginx/skill-wishpool.error.log;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 這一行一定要用 $remote_addr,**不要**用 $proxy_add_x_forwarded_for。
        # $proxy_add_x_forwarded_for 會把用戶端自己送來的 X-Forwarded-For 接在前面,
        # 而伺服器取的是第一個位址 —— 那等於讓任何人自帶假 IP,速率限制與
        # 「一人一票」直接失效。這裡必須整個覆寫掉。
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # 寫入類請求多一層限流(讀取不限,不然搜尋會很難用)。
    location = /api/wishes {
        limit_req zone=wishpool_write burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }
}
