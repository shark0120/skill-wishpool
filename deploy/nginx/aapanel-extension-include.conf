# Skill 許願池 —— aaPanel / 寶塔 專用的 include 片段
#
# 用在「網站已經由面板建好」的情況:不要去改面板產生的 vhost 檔(它會被覆寫),
# 而是把這個檔放進面板已經幫你 include 的 extension 目錄:
#
#   /www/server/panel/vhost/nginx/extension/<你的網域>/wishpool.conf
#
# 面板的 vhost 裡本來就有這一行,所以放進去就會生效:
#   include /www/server/panel/vhost/nginx/extension/<你的網域>/*.conf;
#
# ⚠️ 這個檔是 **server 區塊內** 的片段:
#    - 不能放 limit_req_zone(那個只能放在 http 區塊)。要在代理層限流請用面板的
#      「防火牆」或另外在 http 區塊宣告 zone,這裡只放 limit_req。
#    - 不能放 server { } 或 listen。

# ── Cloudflare 後面要取真實 IP ────────────────────────────────────────
# 不做這件事的話,$remote_addr 會是 Cloudflare 邊緣節點的位址,
# **同一個機房出來的所有訪客會被當成同一個人** —— 速率限制會誤殺,
# 「一人一票」也會直接失效。
#
# 只信任來自 Cloudflare 網段的 CF-Connecting-IP,所以直連原站的人偽造這個
# 標頭是沒有用的。IP 清單用 deploy/refresh-cf-ips.sh 更新(Cloudflare 會增減網段)。
include /www/server/panel/vhost/nginx/extension/cloudflare-realip.conf;

# ⚠️ 面板的 vhost 裡有這兩條正則 location:
#     location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$   { expires 30d; }
#     location ~ .*\.(js|css)?$                    { expires 12h; }
# 它們會**直接從磁碟的網站根目錄**撈檔案,繞過我們的反向代理與應用層白名單。
# 因為程式碼就 checkout 在網站根目錄,結果是 repo 裡任何 .js/.css/圖檔都能被
# 公開讀走(實測 /src/vendor.js 回 200)。
#
# nginx 的正則 location 是「先定義先贏」,而這個檔案被 include 的位置在那兩條
# 之前,所以在這裡重新定義同樣的樣式就能把它們蓋掉,一律轉給應用程式 ——
# 應用程式只服務 public/ 底下、副檔名在白名單內的檔案。
location ~* \.(js|css|gif|jpg|jpeg|png|bmp|swf|webp|ico|map|json|py|md|toml|lock)$ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $remote_addr;
}

location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ⚠️ 一定要用 $remote_addr,**不要**用 $proxy_add_x_forwarded_for。
    # 後者會把用戶端自己送來的 X-Forwarded-For 接在最前面,而伺服器取的是
    # 第一個位址 —— 那等於讓任何人自帶假 IP,速率限制與一人一票直接失效。
    proxy_set_header X-Forwarded-For   $remote_addr;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # 許願內容上限 64KB,不需要更大。
    client_max_body_size 128k;
}
