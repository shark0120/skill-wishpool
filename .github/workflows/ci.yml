name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 專案宣稱支援 3.9+,所以就真的每一版都跑,不要只跑一版然後在 README 亂寫。
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 後端零依賴檢查
        run: |
          # 後端仍然只用標準函式庫:伺服器上不該需要 pip install 任何東西。
          # (前端的動畫引擎走 npm,但那是**建置時**的事,見 build 這個 job。)
          test ! -f requirements.txt || (echo "後端不該有 requirements.txt" && exit 1)
          grep -qE '^\s*import (animejs|lenis)' server.py && exit 1 || true

      - name: 語法檢查
        run: |
          python -m py_compile server.py scripts/*.py

      - name: 對比度(WCAG AA)
        run: python scripts/check_contrast.py

      - name: 端到端自我測試
        run: python scripts/selftest.py

      - name: 反向對照(拆掉防護,測試必須變紅)
        run: python scripts/selftest.py --verify-gauge

  build:
    # 前端動畫引擎是 npm 依賴,在**建置時**用 esbuild 打包並內嵌進 public/index.html。
    # 這個 job 證明版控裡那份 HTML 真的是從 src/vendor.js 建出來的,沒有人手改過
    # vendor 區塊、也沒有偷塞東西進去。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: 重新打包並比對
        run: |
          npx esbuild src/vendor.js --bundle --minify --format=iife \
            --target=es2020 --outfile=build/vendor.min.js
          python scripts/build.py --check

      - name: 執行時不准有外部請求
        run: |
          # 打包的意義就是使用者的瀏覽器不連外。出現任何 CDN 網址就失敗。
          ! grep -nE '//(cdn\.|unpkg\.com|.*jsdelivr|esm\.sh|fonts\.googleapis)' public/index.html

      - name: 授權清單要跟得上依賴
        run: |
          for pkg in $(node -p "Object.keys(require('./package.json').dependencies).join(' ')"); do
            grep -q "$pkg" THIRD-PARTY.md || {
              echo "依賴 $pkg 沒有列進 THIRD-PARTY.md"; exit 1; }
          done
          echo "所有執行時依賴都有署名。"

  static-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 匯出的靜態快照必須跟版控裡的一致
        run: |
          python scripts/export_static.py --from-seed
          # generated_at 每次都會變,所以比對時把它剔掉。
          python - <<'PY'
          import json, subprocess, sys
          with open('public/wishes.json', encoding='utf-8') as fh:
              fresh = json.load(fh)
          committed = json.loads(subprocess.check_output(
              ['git', 'show', 'HEAD:public/wishes.json']).decode('utf-8'))
          for d in (fresh, committed):
              d.pop('generated_at', None)
          if fresh != committed:
              print('public/wishes.json 跟 data/seed.json 不同步了。')
              print('請跑 python scripts/export_static.py --from-seed 再 commit。')
              sys.exit(1)
          print('靜態快照同步。')
          PY
